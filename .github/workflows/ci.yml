name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          . .venv/bin/activate
          ruff check .

      - name: Tests (unitários rápidos)
        env:
          PYTHONPATH: ${{ github.workspace }}
          CI: "true"
        run: |
          . .venv/bin/activate
          pytest -q -m "not slow and not integration"

      - name: API smoke (/health)
        env:
          PYTHONPATH: ${{ github.workspace }}
          LOG_JSON: "false"
        run: |
          . .venv/bin/activate
          uvicorn api.main:app --host 127.0.0.1 --port 8000 --log-level warning &
          UV_PID=$!
          for i in $(seq 1 10); do
            if curl -sSf http://127.0.0.1:8000/health; then
              SUCCESS=1
              break
            fi
            sleep 2
          done
          kill $UV_PID || true
          if [ "${SUCCESS:-0}" != "1" ]; then
            echo "Healthcheck failed"
            exit 1
          fi
